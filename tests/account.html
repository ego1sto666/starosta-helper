<!doctype html><meta charset="utf-8"><title>Аккаунт старосты</title>
<iframe id="app" style="width:390px;height:850px;border:0"></iframe>
<script>
const report = [], errors = [], calls = [];
window.calls = calls;
const wait = ms => new Promise(r => setTimeout(r, ms));
function check(ok, label) { report.push(`${ok ? 'OK' : 'FAIL'} ${label}`); if (!ok) errors.push(label); }
async function until(fn, label) { for (let i = 0; i < 70; i++) { const x = fn(); if (x) return x; await wait(100); } throw Error('Не дождались: ' + label); }
async function run() {
  localStorage.clear();
  const frame = document.querySelector('#app');
  frame.src = '/index.html#account/register';
  await new Promise(r => frame.onload = r);
  let d = frame.contentDocument;
  await until(() => d.querySelector('form[data-auth="register"]'), 'регистрация без сервера');
  check(d.querySelector('form[data-auth="register"] button:last-child').disabled, 'без сервера регистрация закрыта');
  check(d.querySelector('.account__note')?.textContent.includes('Сервер пока не подключён'), 'причина понятна');
  check(!localStorage.getItem('starosta.data'), 'экран аккаунта не создаёт данные группы');

  let html = await (await fetch('/index.html')).text();
  html = html.replace('<head>', '<head><base href="/">');
  const code = `window.STAROSTA_PRIVACY_URL='/privacy'; window.StarostaAPI={enabled:()=>true,auth:{
    me:()=>Promise.reject({status:401}),
    register:v=>{parent.calls.push(['register',v]);return Promise.resolve({id:'u1',login:v.login,email:v.email,name:v.name})},
    login:(login,password)=>{parent.calls.push(['login',login,password]);return Promise.resolve({id:'u1',login,email:'a@example.ru',name:'Староста'})},
    logout:()=>{parent.calls.push(['logout']);return Promise.resolve()}},groups:{list:()=>Promise.resolve([])}};`;
  const close = '</scr' + 'ipt>';
  html = html.replace('<script src="js/app.js">' + close, '<scr' + 'ipt>' + code + close + '<script src="js/app.js">' + close);
  frame.srcdoc = html;
  await new Promise(r => frame.onload = r);
  frame.contentWindow.location.hash = '#account/register';
  d = frame.contentDocument;
  const f = await until(() => d.querySelector('form[data-auth="register"]'), 'регистрация с API');
  check(!f.querySelector('button:last-child').disabled, 'с сервером и политикой регистрация доступна');
  f.elements.login.value = 'starosta1'; f.elements.email.value = 'a@example.ru';
  f.elements.password.value = 'Parol2026'; f.elements.confirm.value = 'Drugoi2026'; f.elements.consent.checked = true;
  f.requestSubmit(); await wait(150);
  check(d.querySelector('.form-err')?.textContent.includes('не совпадают') && calls.length === 0, 'разные пароли не отправляются');
  f.elements.confirm.value = 'Parol2026'; f.requestSubmit();
  await until(() => d.querySelector('[data-act="accountLogout"]'), 'успешная регистрация');
  check(calls[0]?.[0] === 'register' && calls[0][1].consent === true, 'регистрация вызывает API с согласием');
  check(!localStorage.getItem('starosta.data'), 'регистрация не переносит данные без отдельного шага');
  d.querySelector('[data-act="accountLogout"]').click();
  await until(() => d.querySelector('form[data-auth="register"]'), 'выход');
  check(calls.some(c => c[0] === 'logout'), 'выход вызывает API');
  frame.contentWindow.location.hash = '#account';
  const loginForm = await until(() => d.querySelector('form[data-auth="login"]'), 'вход');
  loginForm.elements.login.value = 'starosta1'; loginForm.elements.password.value = 'Parol2026'; loginForm.requestSubmit();
  await until(() => d.querySelector('[data-act="accountLogout"]'), 'успешный вход');
  check(calls.some(c => c[0] === 'login' && c[1] === 'starosta1'), 'вход вызывает API');
  report.push('ERRORS: ' + (errors.length ? errors.join(' | ') : 'нет'));
}
run().catch(e => report.push('FAIL ' + e.message, 'ERRORS: ' + e.message))
  .finally(() => fetch('/__save/result-account.txt', { method:'POST', body:report.join('\n') }));
</script>
