<!doctype html><meta charset="utf-8"><title>features.html</title>
<body style="margin:0"><iframe id="f" style="width:420px;height:900px;border:0"></iframe>
<script>
const R = [], errors = [];
const log = (...a) => { const s = a.join(" "); R.push(s); console.log("T: " + s); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const F = () => document.getElementById("f"), W = () => F().contentWindow, D = () => F().contentDocument;
async function until(fn, ms = 5000, what = "") { const t = Date.now(); while (Date.now() - t < ms) { try { const v = fn(); if (v) return v; } catch (e) {} await sleep(100); } throw new Error("timeout: " + what); }
let clip = "";
async function load(hash = "#home") {
  F().src = "/index.html?r=" + Math.random() + hash;
  await new Promise(r => F().onload = r);
  W().addEventListener("error", e => errors.push(e.message + " @" + e.lineno));
  W().addEventListener("unhandledrejection", e => errors.push("rej " + (e.reason && e.reason.message)));
  try { Object.defineProperty(W().navigator, "clipboard", { value: { writeText: t => { clip = t; return Promise.resolve(); } }, configurable: true }); } catch (e) {}
  await until(() => D().querySelector("#view").children.length && !D().querySelector('[aria-busy="true"]'), 8000, "render");
  await sleep(700);
  const s = D().querySelector("#sheet"); if (s && !s.hidden) D().querySelector('#sheet [data-act="closeSheet"]')?.click();
}
const $ = s => D().querySelector(s), $$ = s => [...D().querySelectorAll(s)];
const click = s => { const el = typeof s === "string" ? $(s) : s; if (!el) throw new Error("no element " + s); el.click(); };
const data = () => JSON.parse(W().localStorage.getItem("starosta.data"));
const setData = d => W().localStorage.setItem("starosta.data", JSON.stringify(d));
const text = s => ($(s) ? $(s).innerText.replace(/\s+/g, " ").trim() : "(нет " + s + ")");
const go = async h => { W().location.hash = h; await sleep(250); };
const iso = k => { const d = new Date(); d.setDate(d.getDate() + k); return d.toISOString().slice(0, 10).replace(/^(\d+)-(\d+)-(\d+)$/, (m, y, mo, da) => `${y}-${mo}-${da}`); };

async function run() {
  localStorage.clear();
  const real = await (await fetch("/__t/fixtures/demo.json")).json();
  real.settings.nntu_group = "26-ИВТ-2-1"; real.settings.nntu_checked = new Date().toISOString().slice(0, 10);
  await load(); setData(real); await load();

  // 1. сдачи
  await go("#study/works");
  log("1 tabs:", $$("#view .seg button").map(b => b.textContent).join(" | "), "| fab:", D().getElementById("fab").dataset.kind, "| empty:", text("#view .empty b"));
  click("#fab"); await until(() => $('form[data-form="work"]'), 2000, "work form");
  let f = $('form[data-form="work"]'); f.title.value = "Лабораторная №3"; f.subject.value = "Информатика (подгруппа 3)"; f.due.value = iso(3); f.requestSubmit();
  await until(() => W().location.hash.startsWith("#check/works/"), 2000, "check screen"); await sleep(350);
  log("1 check:", text(".topbar__title"), "|", text(".topbar__sub"), "| rows:", $$('[data-act="checkToggle"]').length);
  click($$('[data-act="checkToggle"]')[0]); await sleep(150); click($$('[data-act="checkToggle"]')[1]); await sleep(150);
  log("1 after 2 toggles:", text(".topbar__sub"));
  click('#actionbar [data-act="copyText"]'); await sleep(150); log("1 copy:", clip.replace(/\n/g, " / ").slice(0, 160));
  click('#actionbar [data-act="checkAll"]'); await sleep(200); log("1 all:", text(".topbar__sub"));
  await go("#study/works"); log("1 list (open):", text("#view .empty b") || "-", "| done tab:", $$('#view .filter button')[1].textContent);

  // 2. касса
  await go("#tasks/funds"); click("#fab"); await until(() => $('form[data-form="fund"]'), 2000);
  f = $('form[data-form="fund"]'); f.title.value = "Подарок куратору"; f.amount.value = "200"; f.requestSubmit();
  await until(() => W().location.hash.startsWith("#check/funds/"), 2000, "fund check"); await sleep(350);
  [0, 1, 2].forEach(i => $$('[data-act="checkToggle"]')[i].click()); await sleep(300);
  log("2 fund:", text(".topbar__sub"), "| bar:", text(".markbar__count"));
  await go("#tasks/funds"); log("2 card:", text("#view .work"));

  // 3. сессия
  await go("#study/exams"); click("#fab"); await until(() => $('form[data-form="exam"]'), 2000);
  f = $('form[data-form="exam"]'); f.subject.value = "Математика"; f.date.value = iso(10); f.time.value = "09:00"; f.room.value = "6125, корп. 6"; f.requestSubmit(); await sleep(300);
  log("3 exams:", text("#view .event"));
  await go("#home"); log("3 home tips:", $$(".tip b").map(b => b.textContent).join(" | "));

  // 4. больничный
  const st = real.students.find(s => Object.values(real.attendance).some(r => r.marks && r.marks[s.id] === "н"));
  const recKey = Object.keys(real.attendance).find(k => real.attendance[k].marks[st.id] === "н"), recDate = recKey.split("|")[0];
  await go("#student/" + st.id);
  click('[data-act="sickAdd"]'); await until(() => $('form[data-form="sick"]'), 2000, "sick form");
  f = $('form[data-form="sick"]'); f.from.value = recDate; f.to.value = iso(2); f.note.value = "Справка №5"; f.requestSubmit(); await sleep(300);
  log("4 sick toast:", text("#toast"), "| mark now:", data().attendance[recKey].marks[st.id]);
  log("4 profile:", text("#view .profile .person__meta"), "| card:", text("#view .card:nth-of-type(2)").slice(0, 80));
  const lid = data().lessons.find(l => l.day === (new Date().getDay() + 6) % 7)?.id;
  await go("#group"); log("4 group meta:", text(`#people a[href="#student/${st.id}"] .person__meta`));

  // 5. риск недопуска
  await go("#stats"); log("5 stats risk head:", text("#view .section-head h2"), "| rows:", $$("#view .list--cols")[0]?.children.length);
  click('[data-f="risk"]'); await until(() => $('form[data-form="risk"]'), 2000); f = $('form[data-form="risk"]'); f.pct.value = "50"; f.requestSubmit(); await sleep(300);
  log("5 threshold 50:", text("#view .section-head h2"), "| rows:", $$("#view .list--cols")[0]?.children.length, "| saved:", data().settings.risk_pct);

  // 6. тексты для чата и #now
  await go("#journal"); click('#topbar [data-act="copyDay"]'); await sleep(200); log("6 day text:", clip.replace(/\n/g, " / ").slice(0, 220));
  await go("#now"); log("6 now →", W().location.hash);
  await go("#help"); log("6 help:", text("#view .hero h1"), "| steps:", $$(".help-step").length);

  // 7. код-пароль
  await go("#settings"); click('[data-act="form"][data-f="pin"]'); await until(() => $('form[data-form="pin"]'), 2000);
  f = $('form[data-form="pin"]'); f.p1.value = "1234"; f.p2.value = "4321"; f.requestSubmit(); await sleep(150); log("7 mismatch:", text(".form-err"));
  f.p2.value = "1234"; f.requestSubmit(); await sleep(400); log("7 pin set:", !!W().localStorage.getItem("starosta.pin"), "| toast:", text("#toast"));
  await load("#home"); log("7 locked:", !!$(".lock"), "| nav hidden:", getComputedStyle($(".nav")).display);
  for (const k of "1111") click(`[data-act="pinKey"][data-k="${k}"]`); await sleep(700); log("7 wrong → still locked:", !!$(".lock"));
  for (const k of "1234") click(`[data-act="pinKey"][data-k="${k}"]`); await sleep(500); log("7 right → unlocked:", !$(".lock"), "| home:", !!$(".hero"));
  await go("#settings"); click('[data-act="pinOff"]'); await sleep(200); click('#sheet [data-act="pinOff"][data-confirmed="1"]'); await sleep(200);
  log("7 off:", W().localStorage.getItem("starosta.pin"));

  // 8. академ и отчисление: студент выпадает из списков, история остаётся
  const n0 = data().students.length, sid = data().students[0].id, sid2 = data().students[1].id;
  await go("#student/" + sid); click('[data-act="form"][data-f="academ"]'); await until(() => $('form[data-form="academ"]'), 2000);
  f = $('form[data-form="academ"]'); f.from.value = iso(-3); f.to.value = iso(-5); f.requestSubmit(); await sleep(150); log("8 bad academ:", text(".form-err"));
  f.to.value = iso(200); f.note.value = "Приказ № 1"; f.requestSubmit(); await sleep(300);
  log("8 academ:", JSON.stringify(data().students.find(x => x.id === sid), ["status", "status_note"]), "| card:", text(".status-card h3"));
  await go("#student/" + sid2); click('[data-act="form"][data-f="expel"]'); await until(() => $('form[data-form="expel"]'), 2000);
  f = $('form[data-form="expel"]'); f.from.value = iso(0); f.requestSubmit(); await sleep(300);
  await go("#group/students"); log("8 group:", text(".topbar__sub"), "| away sections:", $$(".list--away").length, "| всего в данных:", data().students.length === n0);
  const l0 = data().lessons.find(l => !/подгруппа/.test(l.subject));
  await go(`#mark/${l0.id}/${iso(0)}`); const ids = $$('#view [data-act="mark"]').map(e => e.dataset.id);
  log("8 mark list:", ids.length, "| академ в списке:", ids.includes(sid), "| отчисленный в списке:", ids.includes(sid2));
  await go(`#mark/${l0.id}/${iso(-30)}`); log("8 месяц назад оба в списке:", ["x"].map(() => { const a = $$('#view [data-act="mark"]').map(e => e.dataset.id); return a.includes(sid) && a.includes(sid2); })[0]);
  await go("#student/" + sid); click('[data-act="studentReturn"]'); await sleep(300);
  const back = data().students.find(x => x.id === sid);
  log("8 returned:", !back.status, "| history:", JSON.stringify(back.history));

  // 9. справки: добавить, отметить, должники
  await go("#tasks/docs"); log("9 tabs:", $$("#view .seg button").map(b => b.textContent).join(" | "), "| empty:", text("#view .empty b"));
  click("#fab"); await until(() => $('form[data-form="doc"]'), 2000);
  f = $('form[data-form="doc"]'); f.title.value = "Справка 086/у"; f.note.value = "Деканат, 6-215"; f.requestSubmit();
  await until(() => W().location.hash.startsWith("#check/docs/"), 2000, "to doc check");
  await until(() => $('#view [data-act="checkToggle"]'), 2000, "doc list");
  click($$('#view [data-act="checkToggle"]')[0]); await sleep(200);
  log("9 doc:", text(".topbar__sub"), "| done:", Object.keys(data().docs[0].done).length);

  // 10. опрос: варианты, ответы, текст для чата
  await go("#tasks/polls"); click("#fab"); await until(() => $('form[data-form="poll"]'), 2000);
  f = $('form[data-form="poll"]'); f.title.value = "Когда собрание?"; f.options.value = "Вторник"; f.requestSubmit(); await sleep(150);
  log("10 one option:", text(".form-err"));
  f.options.value = "Вторник\nЧетверг\n\nПятница"; f.requestSubmit();
  await until(() => W().location.hash.startsWith("#poll/"), 2000, "to poll");
  await until(() => $('#view [data-act="pollAnswer"]'), 2000, "poll list");
  const opt = $$('#view [data-act="pollAnswer"]'); click(opt[1]); await sleep(150); click($$('#view [data-act="pollAnswer"]')[4]); await sleep(150);
  click($$('#view [data-act="pollAnswer"]')[5]); await sleep(150); // тот же студент — другой вариант, ответ один
  const pa = data().polls[0].answers;
  log("10 poll:", text(".topbar__sub"), "| answers:", JSON.stringify(Object.values(pa)));
  click('#actionbar [data-act="copyText"]'); await sleep(150); log("10 chat text:", clip.replace(/\n/g, " / "));

  // 11. шаблоны: подстановка
  await go("#templates"); log("11 templates:", $$("#view .tpl").length, "| first:", text("#view .tpl__text").slice(0, 120));
  log("11 left braces:", /\{[а-яё_]+\}/i.test($$("#view .tpl__text").map(e => e.textContent).join(" ")));

  // 12. оценки: экзамен, долг, пересдача, стипендия
  const ex = data().exams.find(x => x.kind !== "Консультация") || null;
  if (ex) {
    await go("#grades/" + ex.id); const set = $$('#view [data-act="gradeSet"][data-f="g"]');
    const sidA = set[0].dataset.id; click(set.find(b => b.dataset.id === sidA && (b.dataset.g === "2" || b.dataset.g === "незач"))); await sleep(200);
    log("12 retake row:", $$('#view [data-act="gradeSet"][data-f="r"]').length > 0);
    const r = $$('#view [data-act="gradeSet"][data-f="r"]').find(b => b.dataset.id === sidA); click(r); await sleep(200);
    log("12 result:", JSON.stringify(data().exams.find(x => x.id === ex.id).results[sidA]));
    await go("#study/grades"); log("12 grades:", text(".topbar__sub"), "| tiles:", $$("#view .tile b").map(b => b.textContent).join("/"));
    await go("#student/" + sidA); log("12 student card:", text("#view .grade-pill"));
  } else log("12 нет экзаменов в данных");

  // 13. контакты: таблица с заголовком и .vcf
  const st0 = data().students.filter(x => !x.status).slice(2, 4);
  await go("#group/students"); click('#topbar [data-f="contacts"]'); await until(() => $('form[data-form="contacts"]'), 2000);
  f = $('form[data-form="contacts"]');
  f.list.value = `Отметка времени\tФИО\tНомер телефона\tЭлектронная почта\tДата рождения\n05.11.2026 10:00\t${st0[0].name}\t89001234567\ttest1@mail.ru\t2007-03-09\n05.11.2026 10:01\tНекто Новый\t+7 900 765 43 21\tnew@mail.ru\t1.2.2006`;
  f.list.dispatchEvent(new Event("input", { bubbles: true })); await sleep(100); log("13 preview:", text("#listPreview"));
  f.requestSubmit(); await sleep(300);
  const c0 = data().students.find(x => x.id === st0[0].id); log("13 filled:", c0.phone, c0.email, c0.birthday, "| toast:", text("#toast"));
  click('#topbar [data-f="contacts"]'); await until(() => $('form[data-form="contacts"]'), 2000); f = $('form[data-form="contacts"]');
  const [fam, nm] = st0[1].name.split(" ");
  f.list.value = `BEGIN:VCARD\nVERSION:3.0\nN:${fam};${nm};;;\nFN:${nm} ${fam}\nTEL;TYPE=CELL:+7 (912) 000-11-22\nEMAIL:vcf@example.com\nEND:VCARD`;
  f.requestSubmit(); await sleep(300);
  const c1 = data().students.find(x => x.id === st0[1].id); log("13 vcf:", c1.phone, c1.email);

  log("ERRORS:", errors.join(" | ") || "нет");
}
run().catch(e => log("FAIL", e.message, errors.join(" | "))).finally(() => fetch("/__save/result-features.txt", { method: "POST", body: R.join("\n") }));
</script>
