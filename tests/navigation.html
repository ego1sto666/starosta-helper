<!doctype html><meta charset="utf-8"><title>Навигация и сроки</title>
<iframe id="app" style="width:320px;height:800px;border:0"></iframe>
<script>
const frame = document.querySelector("#app"), win = () => frame.contentWindow, doc = () => frame.contentDocument;
const one = selector => doc().querySelector(selector), results = [], errors = [];
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
function check(ok, title) { results.push((ok ? "OK " : "FAIL ") + title); if (!ok) errors.push(title); }
async function until(fn) {
  for (let i = 0; i < 80; i++) { const value = fn(); if (value) return value; await wait(60); }
  throw Error("Не дождались экрана");
}
async function open(hash) {
  frame.src = "/index.html?navigation=" + Math.random() + hash;
  await new Promise(resolve => frame.onload = resolve);
}
const dateKey = offset => {
  const date = new Date();
  date.setDate(date.getDate() + offset);
  return [date.getFullYear(), date.getMonth() + 1, date.getDate()].map(n => String(n).padStart(2, "0")).join("-");
};
async function run() {
  localStorage.clear();
  const data = await (await fetch("/__t/fixtures/demo.json")).json();
  data.settings.nntu_group = "";
  data.settings.nntu_checked = dateKey(0);
  data.tasks = [
    { id: "later", title: "Через неделю", due: dateKey(7), kind: "Дедлайн" },
    { id: "today", title: "Сдать список сегодня", due: dateKey(0), kind: "Дедлайн" },
    { id: "late", title: "Вчерашнее дело", due: dateKey(-1), kind: "Дедлайн" },
    { id: "none", title: "Без даты", kind: "Напоминание" },
    { id: "done", title: "Закрытое дело", due: dateKey(-1), done: true, kind: "Дедлайн" }
  ];
  localStorage.setItem("starosta.data", JSON.stringify(data));
  await open("#tasks");
  await until(() => one(".task-period"));
  const groups = [...doc().querySelectorAll(".task-period")].map(e => e.dataset.period);
  check(groups.join() === "overdue,today,upcoming,undated" && !doc().body.textContent.includes("Закрытое дело"), "активные дела разделены по срокам, выполненные остаются в своей вкладке");
  one('[data-act="taskTab"][data-t="done"]').click();
  await until(() => doc().body.textContent.includes("Закрытое дело"));
  win().location.hash = "#home";
  (await until(() => one(".home-priorities [data-act=showOpenTasks]"))).click();
  await until(() => win().location.hash === "#tasks" && one('.task-period[data-period="overdue"]'));
  check(!doc().body.textContent.includes("Закрытое дело"), "быстрый переход показывает активные сроки после просмотра выполненных");
  win().location.hash = "#home";
  (await until(() => one('.home-task[data-id="late"]'))).click();
  const task = await until(() => one('form[data-form="task"]'));
  check(task.elements.title.value === "Вчерашнее дело", "срок на главной открывает нужное дело");
  task.elements.title.value = "   ";
  task.requestSubmit();
  const error = await until(() => one('.form-err:not([hidden])'));
  check(task.firstElementChild === error && doc().activeElement === error, "ошибка формы находится перед полями и получает фокус");
  one('#sheet [data-act="closeSheet"]').click();
  await until(() => one("#sheet").hidden);
  win().location.hash = "#journal";
  (await until(() => one('[data-f="journalDate"]'))).click();
  const form = await until(() => one('form[data-form="journalDate"]'));
  const target = dateKey(-9);
  form.elements.date.value = target;
  form.requestSubmit();
  await until(() => win().location.hash === "#journal/" + target && one('[data-d="' + target + '"][aria-pressed="true"]'));
  await open("#journal/" + target);
  await until(() => one('[data-d="' + target + '"][aria-pressed="true"]'));
  check(doc().querySelectorAll(".days .day").length === 7, "дата журнала сохраняется по прямой ссылке, видны все семь дней");
  one('[data-act="journalToday"]').click();
  await until(() => win().location.hash === "#journal/" + dateKey(0) && one('[data-act="journalToday"]').disabled);
  check(doc().documentElement.scrollWidth <= win().innerWidth, "возврат к сегодняшнему дню работает на ширине 320 пикселей");
}
run().catch(error => { errors.push(error.message); results.push("FAIL " + error.message); })
  .finally(() => fetch("/__save/result-navigation.txt", { method: "POST", body: [...results, "ERRORS: " + (errors.join(" | ") || "нет")].join("\n") }));
</script>
