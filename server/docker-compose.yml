# Сервер целиком на одной машине (VPS в России): база, API, фоновая проверка почты, приём писем, HTTPS.
# Запуск: docker compose up -d   (перед этим — файл .env, см. .env.example и design/architecture.md)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: starosta
      POSTGRES_USER: starosta
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes: [./secrets:/run/starosta:ro]
    depends_on: [db]

  worker:  # IMAP-ящики и очистка старых писем
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.worker"]
    depends_on: [db]

  inbound:  # закрытый SMTP для отдельного доверенного шлюза, публичный вход — через API
    profiles: ["trusted-smtp"]
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.mail.inbound"]
    depends_on: [db]

  telegram:
    profiles: ["telegram"]
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.telegram"]
    depends_on: [db]

  caddy:  # HTTPS-сертификат сам; отдаёт приложение (PWA) и проксирует /api на api:8000
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:  # только файлы приложения — не весь репозиторий (там server/.env с паролями)
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../index.html:/srv/app/index.html:ro
      - ../privacy.html:/srv/app/privacy.html:ro
      - ../manifest.webmanifest:/srv/app/manifest.webmanifest:ro
      - ../sw.js:/srv/app/sw.js:ro
      - ../css:/srv/app/css:ro
      - ../js:/srv/app/js:ro
      - ../assets:/srv/app/assets:ro
      - ../demo:/srv/app/demo:ro
      - caddy:/data
    depends_on: [api]

volumes:
  pgdata:
  caddy:
